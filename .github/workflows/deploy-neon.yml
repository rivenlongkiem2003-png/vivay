name: Deploy VÍ VAY to Neon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      # Neon creates the project ID as a GitHub Actions Variable; it is not
      # sensitive.  The production branch is explicit so a deployment can
      # never accidentally target a preview branch.
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: ${{ vars.NEON_BRANCH || 'production' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      OWNER_PRODUCTION_APPROVED: ${{ secrets.OWNER_PRODUCTION_APPROVED }}
      BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
      DB_POOL_MAX: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run build
          npm test
          npm run secret:scan

      - name: Link the intended Neon project and pull its managed database URL
        run: npx neon link --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --yes --no-config

      - name: Add Function-only secrets to the ignored environment file
        run: |
          node -e "const fs=require('fs'); const keys=['SESSION_SECRET','OWNER_PRODUCTION_APPROVED','BOOTSTRAP_ADMIN_USERNAME','BOOTSTRAP_ADMIN_PASSWORD','PUBLIC_ORIGIN','DB_POOL_MAX']; const body=keys.map((key) => key + '=' + (process.env[key] || '')).join('\\n') + '\\n'; fs.appendFileSync('.env', body);"

      - name: Apply additive schema migrations and deploy the Function
        run: |
          npm run neon:prepare
          npm run neon:migrate
          npx neon deploy --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --env .env --update-existing --no-env-pull
