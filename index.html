<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VÍ VAY — Vay Nhanh Trong Ngày</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="index.css">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }
    .app-shell {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 4px 25px rgba(202, 138, 4, 0.12);
      display: flex;
      flex-direction: column;
      border: 1px solid #fef3c7;
    }
    .banner-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      background: #64b5f6;
    }
    .banner-svg {
      width: 100%;
      height: 140px;
      display: block;
    }
    .banner-svg-2 {
      width: 100%;
      height: 150px;
      display: block;
    }
    .main-body {
      padding: 24px 20px;
      flex: 1;
      background: #ffffff;
      border-radius: 16px 16px 0 0;
      margin-top: -12px;
      position: relative;
      z-index: 2;
    }
    .headline {
      font-size: 16px;
      font-weight: 800;
      color: #92400e;
      margin-bottom: 12px;
    }
    .loan-label {
      font-size: 13px;
      color: #ca8a04;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .amount-display {
      font-size: 32px;
      font-weight: 900;
      color: #b45309;
      margin-bottom: 14px;
    }
    .slider-container {
      width: 100%;
      margin-bottom: 20px;
    }
    input[type=range] {
      width: 100%;
      height: 6px;
      accent-color: #d97706;
      cursor: pointer;
    }
    .slider-range {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #ca8a04;
      margin-top: 6px;
      font-weight: 600;
    }
    .input-box {
      display: flex;
      align-items: center;
      border: 1.5px solid #fde047;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      background: #fffdf5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }
    .input-box .prefix {
      font-size: 14px;
      font-weight: 800;
      color: #b45309;
      margin-right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-box input {
      border: none;
      outline: none;
      font-size: 15px;
      width: 100%;
      color: #92400e;
      font-weight: 700;
      background: transparent;
    }
    .input-box input::placeholder {
      color: #d97706;
      opacity: 0.6;
      font-weight: 500;
    }
    .agree-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .agree-box input {
      accent-color: #d97706;
      width: 18px;
      height: 18px;
    }
    .agree-box a {
      color: #b45309;
      text-decoration: underline;
      font-weight: 700;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.35);
      transition: opacity 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.95;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: -6px;
      margin-bottom: 12px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 2 Banners Chuẩn Theo Ảnh 3 -->
    <div class="banner-container">
      <!-- Banner 1: Đôi bàn tay trao tiền -->
      <svg class="banner-svg" viewBox="0 0 440 140" xmlns="http://www.w3.org/2000/svg">
        <rect width="440" height="140" fill="#67c6eb"/>
        <!-- Tay trái trao tiền -->
        <g transform="translate(0, 10)">
          <!-- Cổ tay áo đỏ -->
          <rect x="-10" y="40" width="80" height="50" rx="4" fill="#a82323"/>
          <rect x="65" y="44" width="10" height="42" fill="#ffffff"/>
          <!-- Bàn tay trái -->
          <path d="M75,48 L170,52 C178,54 180,68 170,72 L120,74 C115,82 105,86 90,82 L75,82 Z" fill="#ffd4b2"/>
          <!-- Tập tiền xanh dày -->
          <g transform="translate(140, 20)">
            <rect x="0" y="30" width="85" height="12" rx="2" fill="#88d49e"/>
            <rect x="2" y="24" width="85" height="12" rx="2" fill="#a3e4b7"/>
            <rect x="4" y="18" width="85" height="12" rx="2" fill="#c4f4d2"/>
            <rect x="6" y="12" width="85" height="12" rx="2" fill="#88d49e"/>
            <!-- Tiền vàng trên đỉnh -->
            <ellipse cx="48" cy="8" rx="16" ry="6" fill="#ffd152"/>
            <ellipse cx="44" cy="5" rx="12" ry="4" fill="#ffe082"/>
          </g>
        </g>
        <!-- Tay phải nhận tiền -->
        <g transform="translate(230, 45)">
          <!-- Bàn tay mở đón tiền -->
          <path d="M0,45 C30,45 60,35 90,15 C98,10 108,18 100,28 C80,48 50,62 10,65 Z" fill="#ffd4b2"/>
          <!-- Cổ tay áo xanh đậm -->
          <rect x="90" y="25" width="20" height="40" fill="#ffffff"/>
          <rect x="105" y="20" width="115" height="50" rx="4" fill="#1b3b6f"/>
        </g>
      </svg>

      <!-- Banner 2: Ngân hàng & Túi tiền may mắn -->
      <svg class="banner-svg-2" viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg">
        <rect width="440" height="150" fill="#92d5f0"/>
        <!-- Đám mây nhẹ -->
        <ellipse cx="270" cy="30" rx="24" ry="10" fill="#ffffff" opacity="0.6"/>
        <ellipse cx="285" cy="26" rx="16" ry="8" fill="#ffffff" opacity="0.6"/>
        <!-- Nền đồi cỏ -->
        <ellipse cx="220" cy="180" rx="260" ry="60" fill="#67c6eb"/>
        <!-- Tòa nhà ngân hàng -->
        <g transform="translate(80, 25)">
          <polygon points="90,10 10,40 170,40" fill="#2d6a4f"/>
          <rect x="15" y="40" width="150" height="10" fill="#d8f3dc"/>
          <circle cx="90" cy="28" r="14" fill="#ffffff"/>
          <text x="90" y="33" font-size="14" fill="#2d6a4f" text-anchor="middle" font-weight="bold">$</text>
          <!-- Cột nhà -->
          <rect x="25" y="50" width="16" height="50" fill="#ffffff"/>
          <rect x="55" y="50" width="16" height="50" fill="#ffffff"/>
          <rect x="105" y="50" width="16" height="50" fill="#ffffff"/>
          <rect x="135" y="50" width="16" height="50" fill="#ffffff"/>
          <!-- Bậc thang -->
          <rect x="10" y="100" width="160" height="12" fill="#d8f3dc"/>
        </g>
        <!-- Bàn tay dâng túi tiền -->
        <g transform="translate(245, 40)">
          <!-- Túi tiền xanh lá to -->
          <path d="M45,28 C25,28 10,45 10,65 C10,90 35,95 50,95 C65,95 90,90 90,65 C90,45 75,28 55,28 Z" fill="#2d6a4f"/>
          <!-- Dây buộc túi -->
          <ellipse cx="50" cy="30" rx="14" ry="4" fill="#f4a261"/>
          <!-- Cổ túi -->
          <polygon points="40,30 35,20 65,20 60,30" fill="#2d6a4f"/>
          <!-- Biểu tượng dollar -->
          <text x="50" y="70" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="900">$</text>
          <!-- Bàn tay nâng túi tiền -->
          <path d="M-50,75 C-20,75 10,80 40,95 L-10,115 Z" fill="#ffd4b2"/>
          <!-- Người mini vui mừng phía sau -->
          <circle cx="95" cy="55" r="5" fill="#333"/>
          <path d="M95,60 L95,75 M95,65 L88,58 M95,65 L102,58 M95,75 L90,88 M95,75 L100,88" stroke="#1b3b6f" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <!-- Khung chính nhập thông tin -->
    <div class="main-body">
      <h2 class="headline">Chạm nhẹ một cái, tiền về tay ngay</h2>
      <div class="loan-label">Số tiền cần vay</div>
      <div class="amount-display" id="loanAmountText">10.000.000 đ</div>
      <div class="slider-container">
        <input type="range" id="loanSlider" min="5000000" max="90000000" step="1000000" value="10000000">
        <div class="slider-range"><span>5 triệu</span><span>90 triệu</span></div>
      </div>
      <div class="input-box">
        <div class="prefix">📞 +84</div>
        <input type="text" id="phoneInput" placeholder="Nhập số điện thoại" maxlength="15" autocomplete="off">
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="agree-box">
        <input type="checkbox" id="agreeCheckbox" checked>
        <label for="agreeCheckbox">Tôi đã đọc <a href="#">Vui lòng đọc điều khoản bảo mật</a></label>
      </div>
      <button class="btn-submit" id="submitBtn">Tiếp tục</button>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
